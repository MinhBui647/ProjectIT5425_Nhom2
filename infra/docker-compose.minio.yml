services:
  minio:
    image: bitnamilegacy/minio:latest
    user: root
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: dairy
      MINIO_ROOT_PASSWORD: hustit5425
      MINIO_DEFAULT_BUCKETS: smart-dairy-lakehouse
      MINIO_BROWSER: "on"
      MINIO_CONSOLE_PORT_NUMBER: "9001"
    volumes:
      - minio_data:/bitnami/minio/data

volumes:
  minio_data:
