[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-dairy-lakehouse"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "minio: opt-in isolated storage demo MinIO E2E",
    "integration: requires live external services or a platform-specific engine",
]
